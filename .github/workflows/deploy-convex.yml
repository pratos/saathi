name: Deploy to Convex

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convex-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static Hosting builds with the production VITE_CONVEX_URL, deploys the
      # Convex backend, then atomically publishes dist/ to convex.site.
      - name: Build and deploy backend and frontend
        run: npm run deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Read redacted OTP failure marker
        shell: bash
        run: |
          set +o pipefail
          timeout 8s npx convex logs --prod --history 500 --jsonl 2>/dev/null | node -e '
            const categories = [
              ["rate_limit", /OtpRateLimited|rate.?limit/i],
              ["configuration", /OtpConfigurationMissing|environment variable/i],
              ["delivery_rejected", /OtpDeliveryRejected|OTP_DELIVERY_REJECTED/i],
              ["verification_code", /createVerificationCode|verification code/i],
              ["network", /fetch failed|network|ECONN|ETIMEDOUT/i],
              ["callback_type", /runMutation|is not a function|undefined/i],
            ];
            const summary = { signIn: { succeeded: 0, failed: 0 }, failures: {}, deliveryStatuses: [] };
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk });
            process.stdin.on("end", () => {
              for (const line of input.split("\n")) {
                if (!line.trim()) continue;
                let entry;
                try { entry = JSON.parse(line); } catch { continue; }
                const joinedLogs = (entry.logLines ?? []).flatMap((log) => log.messages ?? []).join(" ");
                for (const match of joinedLogs.matchAll(/OTP_DELIVERY_REJECTED[^0-9]*(\d+)/g)) {
                  summary.deliveryStatuses.push(Number(match[1]));
                }
                if (entry.kind !== "Completion" || entry.identifier !== "auth:signIn") continue;
                if (!entry.error) {
                  summary.signIn.succeeded += 1;
                  continue;
                }
                summary.signIn.failed += 1;
                const category = categories.find(([, pattern]) => pattern.test(entry.error))?.[0] ?? "other";
                summary.failures[category] = (summary.failures[category] ?? 0) + 1;
              }
              summary.deliveryStatuses = [...new Set(summary.deliveryStatuses)];
              process.stdout.write(JSON.stringify(summary));
            });
          '
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
