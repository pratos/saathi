name: Deploy to Convex

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convex-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static Hosting builds with the production VITE_CONVEX_URL, deploys the
      # Convex backend, then atomically publishes dist/ to convex.site.
      - name: Build and deploy backend and frontend
        run: npm run deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Read redacted OTP failure marker
        shell: bash
        run: |
          set +o pipefail
          timeout 8s npx convex logs --prod --history 300 --jsonl 2>/dev/null | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk });
            process.stdin.on("end", () => {
              const statuses = [...input.matchAll(/OTP_DELIVERY_REJECTED[^0-9]*(\d+)/g)].map((match) => Number(match[1]));
              const authFailures = (input.match(/auth:signIn/g) ?? []).length;
              process.stdout.write(JSON.stringify({ statuses: [...new Set(statuses)], authFailures }));
            });
          '
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
